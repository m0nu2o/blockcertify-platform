
version: '3.9'
services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  blockchain:
    build:
      context: .
      dockerfile: contracts/Dockerfile
    ports:
      - "8545:8545"
    env_file:
      - ./contracts/.env
    restart: unless-stopped
