services:
  - type: web
    name: blockcertify-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false   # Set this in Render dashboard to your Vercel URL
      - key: SERVER_URL
        sync: false   # Set this in Render dashboard to your Render service URL
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard: your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY
        value: https://gateway.pinata.cloud
      - key: ETH_RPC_URL
        value: http://127.0.0.1:8545
      - key: ETH_PRIVATE_KEY
        sync: false
      - key: ETH_CONTRACT_ADDRESS
        sync: false
      - key: ETH_NETWORK_NAME
        value: hardhat
      - key: BLOCKCHAIN_DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
