services:
  - type: web
    name: blockcertify-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://blockcertify.pages.dev
      - key: SERVER_URL
        value: https://blockcertify-api.onrender.com
      - key: MONGODB_URI
        value: mongodb+srv://7973monugoswami_db_user:iA8fi44Kwk3M07W0@cluster0.0txnbgv.mongodb.net/blockcertify
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY
        value: https://gateway.pinata.cloud
      - key: ETH_RPC_URL
        value: http://127.0.0.1:8545
      - key: ETH_PRIVATE_KEY
        sync: false
      - key: ETH_CONTRACT_ADDRESS
        sync: false
      - key: ETH_NETWORK_NAME
        value: hardhat
      - key: BLOCKCHAIN_DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
